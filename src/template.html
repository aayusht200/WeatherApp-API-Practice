<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>

    <body>
        <div class="weather-app">
            <div class="giphy-wrapper">
                <img src="#" alt="weather animation" class="giphy" />
            </div>

            <div class="weather-details">
                <div class="location js-location">Location</div>
                <div class="temp js-temp">--°C</div>
                <div class="date js-date">Date</div>
                <div class="time js-time"></div>

                <div class="meta">
                    <div class="feels js-feels">Feels like: --°C</div>
                    <div class="rain js-rain">Chance of rain: --%</div>
                </div>

                <div class="sun">
                    <div class="sunrise js-sunrise">Sunrise: --</div>
                    <div class="sunset js-sunset">Sunset: --</div>
                </div>
            </div>
        </div>
    </body>
</html>
